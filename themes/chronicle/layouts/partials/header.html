<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="{{ .Site.Home.RelPermalink }}" aria-label="MILES 首页">{{ .Site.Params.brandTitle | default "MILES" }}</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">菜单</button>
    <nav class="site-nav" id="site-nav" aria-label="主导航">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relLangURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <button class="theme-toggle" type="button" aria-label="切换深色模式" title="切换明暗主题">
        <span class="theme-icon theme-icon-moon" aria-hidden="true"></span>
        <span class="theme-icon theme-icon-sun" aria-hidden="true"></span>
      </button>
    </nav>
  </div>
</header>
