{{ if or .NextInSection .PrevInSection }}
<nav class="post-navigation" aria-label="相邻文章">
  {{ with .NextInSection }}<a class="post-nav-item" href="{{ .RelPermalink }}"><span>上一篇</span><strong>{{ .Title }}</strong></a>{{ else }}<span></span>{{ end }}
  {{ with .PrevInSection }}<a class="post-nav-item post-nav-next" href="{{ .RelPermalink }}"><span>下一篇</span><strong>{{ .Title }}</strong></a>{{ else }}<span></span>{{ end }}
</nav>
{{ end }}
